name: Release

on:
  push:
    branches: [main]

# id-token: write   -> OIDC trusted publishing to npm (no NPM_TOKEN, auto provenance)
# contents: write   -> semantic-release pushes the version commit + tag + Release
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # NOTE: no `registry-url` — setup-node's registry-url writes an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` (empty here), which makes npm attempt
      # token auth and SKIP the OIDC exchange (publish then 404s). Omitting it
      # lets `npm publish` do OIDC trusted publishing against the default registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install devtools with Node 22's bundled npm 10 (avoids a known npm 11
      # arborist dedup crash on this dep tree).
      - run: npm install --legacy-peer-deps
      # Trusted publishing needs npm >= 11.5.1; upgrade only for the publish.
      - run: npm install -g npm@latest
      - name: Diagnostics (npm version + OIDC env)
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "OIDC request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm run build
      # semantic-release publishes to npm via exec `npm publish` in the *prepare*
      # step — BEFORE @semantic-release/git commits and before core tags — so npm
      # and the git tag/Release can never desync: if the publish fails, no tag,
      # commit, or Release is created. `--loglevel silly` surfaces the OIDC
      # trusted-publishing token exchange in the logs.
      - name: Release (publish to npm + tag + GitHub Release)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
