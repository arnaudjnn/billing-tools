name: Release

on:
  push:
    branches: [main]

# id-token: write   -> OIDC trusted publishing to npm (no NPM_TOKEN, auto provenance)
# contents: write   -> semantic-release pushes the version commit + tag + Release
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # NOTE: no `registry-url`. setup-node's registry-url writes an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` (empty here), which makes npm try token
      # auth and skip the OIDC exchange. Omit it so OIDC trusted publishing runs
      # against the default registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22's bundled npm 10 installs the dep tree cleanly (a known npm 11
      # arborist dedup crash otherwise). The publish itself forces npm@latest
      # via `npx` (see .releaserc) because OIDC needs npm >= 11.5.1.
      - run: npm install --legacy-peer-deps
      - run: npm run build
      # semantic-release runs `npx --yes npm@latest publish` in its *prepare* step
      # (see .releaserc exec) — BEFORE @semantic-release/git commits and before it
      # tags — so npm and the git tag/Release can never desync: a failed publish
      # creates no tag, commit, or Release. npm@latest (not node_modules/.bin/npm,
      # which npx shadows onto PATH and is too old for OIDC) does the token-less
      # OIDC trusted publish with automatic provenance.
      - name: Release (publish to npm + tag + GitHub Release)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
