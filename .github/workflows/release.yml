name: Release

on:
  push:
    branches: [main]

# id-token: write   -> OIDC trusted publishing to npm (no NPM_TOKEN, auto provenance)
# contents: write   -> semantic-release pushes the version commit + tag + Release
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # NOTE: no `registry-url` — setup-node's registry-url writes an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` (empty here), which makes npm attempt
      # token auth and SKIP the OIDC exchange (publish then 404s). Omitting it
      # lets `npm publish` do OIDC trusted publishing against the default registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install devtools with Node 22's bundled npm 10 (avoids a known npm 11
      # arborist dedup crash on this dep tree).
      - run: npm install --legacy-peer-deps
      # Trusted publishing needs npm >= 11.5.1; upgrade only for the publish.
      - run: npm install -g npm@latest
      - name: Diagnostics (npm version + OIDC env)
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "OIDC request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm run build
      # semantic-release computes the next version + writes package.json/CHANGELOG,
      # commits + tags + creates the GitHub Release. It does NOT publish to npm
      # (npmPublish:false) — we publish at the top level below so npm sees the full
      # GitHub OIDC env directly (no execa/lodash-template layer in the way).
      - name: Version, changelog, tag, GitHub Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Top-level publish → cleanest OIDC trusted-publishing context. Gated on the
      # semantic-release-bumped local version differing from what's already on npm,
      # so no-release pushes (docs:/chore:) don't try to republish.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @arnaudjnn/billing-tools version 2>/dev/null || echo none)
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            npm publish
          else
            echo "No new version to publish."
          fi
