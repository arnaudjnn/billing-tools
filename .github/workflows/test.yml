name: Test

# Runs on every push and PR, and BEFORE a release can happen — this library
# moves money, and until now nothing stopped a broken build being published.
#
# The suite is offline by design: no Stripe key, no WorkOS key, no network. The
# paths that genuinely need Stripe live in the test-clock script, which is run
# deliberately against the test account rather than on every push.
#
# `npm test` builds first and then runs Vitest over test/**: the tests import
# from dist/, so they exercise the artifact that actually gets published.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm, not npm: the repo's lockfile is pnpm-lock.yaml, and `npm install`
      # ignores it entirely — CI was resolving fresh versions on every run, so
      # a transitive dependency could change under it and the lockfile everyone
      # develops against was never validated. --frozen-lockfile makes a stale
      # lockfile a failure instead of a silent re-resolve.
      #
      # release.yml stays on npm on purpose: publishing needs npm >= 11.5.1 for
      # OIDC trusted publishing.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds first, then runs Vitest over test/** — the tests import from
      # dist/, so they exercise the artifact that actually gets published.
      - run: pnpm test
